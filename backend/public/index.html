<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="I. EL FAYK — Portfolio" />
  <title>I. EL FAYK</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg:           #0a0a0a;
      --surface:      #111111;
      --surface-2:    #181818;
      --border:       #242424;
      --text:         #f0f0f0;
      --muted:        #666666;
      --accent:       #818cf8;
      --accent-dim:   rgba(129,140,248,.12);
      --radius:       8px;
      --max:          860px;
      --transition:   .18s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ─────────────────────────────────────── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,10,.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max); margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-weight: 700; font-size: 1rem; letter-spacing: .02em;
      color: var(--text); text-decoration: none;
    }
    .nav-links { display: flex; gap: 1.75rem; list-style: none; }
    .nav-links a {
      color: var(--muted); font-size: .875rem; text-decoration: none;
      transition: color var(--transition);
    }
    .nav-links a:hover { color: var(--text); }

    /* ── Sections ────────────────────────────────── */
    .section {
      max-width: var(--max); margin: 0 auto;
      padding: 5.5rem 1.5rem;
    }
    .section + .section { border-top: 1px solid var(--border); }
    .label {
      font-size: .7rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: .875rem;
    }
    h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }

    /* ── Hero ────────────────────────────────────── */
    #hero { padding-top: 7rem; padding-bottom: 7rem; }
    .hero-name {
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 800; line-height: 1.08;
      letter-spacing: -.02em;
      margin-bottom: .875rem;
    }
    .hero-title {
      font-size: 1.05rem; color: var(--muted);
      margin-bottom: 2.25rem;
      min-height: 1.6em;
    }
    .cta { display: flex; gap: .875rem; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center;
      padding: .65rem 1.35rem; border-radius: var(--radius);
      font-size: .875rem; font-weight: 500;
      text-decoration: none; border: none; cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      font-family: inherit;
    }
    .btn:hover  { opacity: .82; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* ── About ───────────────────────────────────── */
    .about-bio {
      color: var(--muted); max-width: 62ch;
      margin-bottom: 1.75rem; line-height: 1.8;
    }
    .skills { display: flex; flex-wrap: wrap; gap: .5rem; }
    .skill-tag {
      padding: .3rem .75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: .78rem; color: var(--text);
    }

    /* ── Projects ────────────────────────────────── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 1.25rem;
    }
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.375rem;
      display: flex; flex-direction: column;
      transition: border-color var(--transition), transform var(--transition);
    }
    .project-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .project-title { font-size: .95rem; font-weight: 600; margin-bottom: .45rem; }
    .project-desc  { font-size: .84rem; color: var(--muted); line-height: 1.6; flex: 1; margin-bottom: 1rem; }
    .project-tech  { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .875rem; }
    .tech-tag {
      font-size: .7rem; padding: .18rem .5rem;
      background: var(--accent-dim); color: var(--accent);
      border-radius: 4px;
    }
    .project-link {
      font-size: .8rem; color: var(--accent);
      text-decoration: none; align-self: flex-start;
    }
    .project-link:hover { text-decoration: underline; }

    /* ── Contact ─────────────────────────────────── */
    .contact-intro { color: var(--muted); max-width: 50ch; margin-bottom: 2rem; }
    .contact-form  { max-width: 460px; }
    .field         { margin-bottom: 1.125rem; }
    label          { display: block; font-size: .82rem; color: var(--muted); margin-bottom: .45rem; }
    input, textarea {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit; font-size: .9rem;
      outline: none;
      transition: border-color var(--transition);
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 120px; }
    .form-msg { margin-top: .875rem; font-size: .84rem; min-height: 1.4em; }
    .form-msg.ok  { color: #4ade80; }
    .form-msg.err { color: #f87171; }

    /* ── Skeleton ────────────────────────────────── */
    .sk {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 4px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .sk-text  { height: 13px; margin-bottom: 9px; }
    .sk-block { height: 110px; border-radius: var(--radius); }
    .sk-card  {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.375rem;
    }
    .sk-pill  { height: 28px; border-radius: 100px; width: 72px; }

    /* ── Footer ──────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
    }
    /* Invisible admin link — visible only on hover */
    .admin-dot {
      display: inline-block; margin-left: .5rem;
      color: transparent; font-size: .65rem;
      text-decoration: none; user-select: none;
      transition: color var(--transition);
    }
    .admin-dot:hover { color: var(--muted); }

    /* ── Responsive ──────────────────────────────── */
    @media (max-width: 600px) {
      .section { padding: 3.5rem 1.25rem; }
      #hero    { padding-top: 5rem; padding-bottom: 5rem; }
      .nav-links { gap: 1.25rem; }
    }
  </style>
</head>
<body>

<!-- Nav -->
<nav>
  <div class="nav-inner">
    <a href="#hero" class="nav-logo">I. EL FAYK</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- Hero -->
<section id="hero" class="section">
  <div class="label">Portfolio</div>
  <h1 class="hero-name">I. EL FAYK</h1>
  <p class="hero-title" id="hero-title">Loading&hellip;</p>
  <div class="cta">
    <a href="#projects" class="btn btn-primary">View Projects</a>
    <a href="#contact"  class="btn btn-ghost">Get in Touch</a>
  </div>
</section>

<!-- About -->
<section id="about" class="section">
  <div class="label">About</div>
  <h2>Who I Am</h2>
  <div id="about-body">
    <!-- skeleton -->
    <div class="sk sk-text" style="width:78%"></div>
    <div class="sk sk-text" style="width:64%;margin-bottom:1.5rem"></div>
    <div class="skills">
      <div class="sk sk-pill"></div>
      <div class="sk sk-pill"></div>
      <div class="sk sk-pill"></div>
      <div class="sk sk-pill" style="width:90px"></div>
    </div>
  </div>
</section>

<!-- Projects -->
<section id="projects" class="section">
  <div class="label">Work</div>
  <h2>Projects</h2>
  <div class="projects-grid" id="projects-grid">
    <!-- skeleton cards -->
    <div class="sk-card">
      <div class="sk sk-text" style="width:55%"></div>
      <div class="sk sk-block"></div>
    </div>
    <div class="sk-card">
      <div class="sk sk-text" style="width:65%"></div>
      <div class="sk sk-block"></div>
    </div>
    <div class="sk-card">
      <div class="sk sk-text" style="width:50%"></div>
      <div class="sk sk-block"></div>
    </div>
  </div>
</section>

<!-- Contact -->
<section id="contact" class="section">
  <div class="label">Contact</div>
  <h2>Get in Touch</h2>
  <p class="contact-intro">Have a project in mind or just want to say hello? Send a message and I&rsquo;ll get back to you.</p>
  <form class="contact-form" id="contact-form" novalidate>
    <div class="field">
      <label for="c-name">Name</label>
      <input id="c-name" name="name" type="text" placeholder="Your name" required />
    </div>
    <div class="field">
      <label for="c-email">Email</label>
      <input id="c-email" name="email" type="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="c-msg">Message</label>
      <textarea id="c-msg" name="message" placeholder="Your message&hellip;" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary" id="send-btn">Send Message</button>
    <p class="form-msg" id="form-msg" aria-live="polite"></p>
  </form>
</section>

<!-- Footer -->
<footer>
  <span>&copy; 2025 I. EL FAYK</span>
  <a href="/admin.html" class="admin-dot" tabindex="-1" aria-hidden="true">&middot;</a>
</footer>

<script>
  /* ── Helpers ─────────────────────────────────── */
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function safeUrl(u) {
    try {
      const parsed = new URL(u);
      return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? u : '#';
    } catch { return '#'; }
  }

  /* ── Load About ──────────────────────────────── */
  async function loadAbout() {
    try {
      const r = await fetch('/api/about');
      const d = await r.json();
      document.getElementById('hero-title').textContent = d.title || '';
      document.getElementById('about-body').innerHTML =
        '<p class="about-bio">' + esc(d.bio) + '</p>' +
        '<div class="skills">' +
          (d.skills || []).map(s => '<span class="skill-tag">' + esc(s) + '</span>').join('') +
        '</div>';
    } catch {
      document.getElementById('hero-title').textContent = '';
      document.getElementById('about-body').innerHTML =
        '<p style="color:var(--muted)">Could not load profile data.</p>';
    }
  }

  /* ── Load Projects ───────────────────────────── */
  async function loadProjects() {
    const grid = document.getElementById('projects-grid');
    try {
      const r    = await fetch('/api/projects');
      const list = await r.json();
      if (!Array.isArray(list) || !list.length) {
        grid.innerHTML = '<p style="color:var(--muted)">No projects yet.</p>';
        return;
      }
      grid.innerHTML = list.map(p =>
        '<div class="project-card">' +
          '<div class="project-title">' + esc(p.title) + '</div>' +
          '<p class="project-desc">' + esc(p.description) + '</p>' +
          '<div class="project-tech">' +
            (p.tech || []).map(t => '<span class="tech-tag">' + esc(t) + '</span>').join('') +
          '</div>' +
          (p.url ? '<a class="project-link" href="' + esc(safeUrl(p.url)) +
            '" target="_blank" rel="noopener noreferrer">View &#8250;</a>' : '') +
        '</div>'
      ).join('');
    } catch {
      grid.innerHTML = '<p style="color:var(--muted)">Could not load projects.</p>';
    }
  }

  /* ── Contact Form ────────────────────────────── */
  document.getElementById('contact-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('send-btn');
    const msg = document.getElementById('form-msg');
    btn.disabled   = true;
    btn.textContent = 'Sending…';
    msg.className   = 'form-msg';
    msg.textContent = '';
    try {
      const res = await fetch('/api/contact', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:    document.getElementById('c-name').value.trim(),
          email:   document.getElementById('c-email').value.trim(),
          message: document.getElementById('c-msg').value.trim(),
        }),
      });
      const data = await res.json();
      if (res.ok) {
        msg.textContent = 'Message sent — I’ll be in touch soon.';
        msg.className   = 'form-msg ok';
        e.target.reset();
      } else {
        msg.textContent = data.error || 'Something went wrong.';
        msg.className   = 'form-msg err';
      }
    } catch {
      msg.textContent = 'Network error — please try again.';
      msg.className   = 'form-msg err';
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Send Message';
    }
  });

  loadAbout();
  loadProjects();
</script>
</body>
</html>
